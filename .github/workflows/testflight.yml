name: TestFlight

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        type: choice
        default: build-and-upload
        options:
          - build-and-upload
          - store-listing-only

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # The Issuer ID only identifies the App Store Connect team; it isn't secret.
      ASC_ISSUER_ID_PUBLIC: cf0b60a4-0dcd-4651-ba53-0aba0bc6c678
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD || secrets.MATCH_PASSWORRD }}
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in MATCH_PASSWORD CERTS_REPO_TOKEN; do
            if [ -n "${!name}" ]; then echo "✅ $name is set"; else echo "❌ $name is missing"; missing=1; fi
          done
          CLEAN=$(printf '%s' "$CERTS_REPO_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          echo "CLEAN_CERTS_TOKEN=$CLEAN" >> "$GITHUB_ENV"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLEAN" https://api.github.com/repos/belgarath534/ios-certificates)
          if [ "$CODE" = "200" ]; then echo "✅ Token can reach ios-certificates"; else echo "❌ Token can't reach ios-certificates (HTTP $CODE)"; missing=1; fi
          exit $missing

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: belgarath534/ios-certificates
          token: ${{ env.CLEAN_CERTS_TOKEN }}
          path: .certs-repo

      - name: Collect Apple API keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          if [ -d .certs-repo ]; then
            find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          fi
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          fi
          rm -rf .certs-repo
          echo "Keys found: $(ls "$HOME/.asc/candidates" | tr '\n' ' ')"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Find the key Apple accepts
        run: ruby scripts/check_asc_key.rb

      - name: Upload the store listing only
        if: inputs.mode == 'store-listing-only'
        run: bundle exec fastlane listing

      - uses: maxim-lobanov/setup-xcode@v1
        if: inputs.mode != 'store-listing-only'
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        if: inputs.mode != 'store-listing-only'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build, upload to TestFlight and update the store listing
        if: inputs.mode != 'store-listing-only'
        run: bundle exec fastlane beta
