workflows:
  # Quick test: proves the App Store Connect key stored in Codemagic works,
  # shows which Key ID it is, and registers the Sol Echo Bundle ID.
  check-apple-key:
    name: Check Apple key + register Bundle ID
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      # Must match the key's name in Codemagic → Team settings → Integrations → Developer Portal
      app_store_connect: CHANGE_ME
    scripts:
      - name: Show which key Codemagic uses
        script: |
          echo "Key ID used by Codemagic: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          echo "Issuer ID starts with:   ${APP_STORE_CONNECT_ISSUER_ID:0:8}"
          if [ "$APP_STORE_CONNECT_KEY_IDENTIFIER" = "Y9F2UGJ98X" ]; then
            echo "Same Key ID as the GitHub build"
          else
            echo "DIFFERENT Key ID than the GitHub build (Y9F2UGJ98X)"
          fi
      - name: Talk to Apple and register com.solecho.game
        script: |
          # If the key is bad, this fails and the build goes red.
          EXISTING=$(app-store-connect bundle-ids list --bundle-id-identifier com.solecho.game --json)
          echo "✅ Apple accepted Codemagic's key"
          if echo "$EXISTING" | grep -q '"com.solecho.game"'; then
            echo "✅ Bundle ID com.solecho.game is already registered"
          else
            app-store-connect bundle-ids create com.solecho.game --name "Sol Echo" --platform IOS
            echo "✅ Registered Bundle ID com.solecho.game"
          fi
